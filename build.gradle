plugins {
    id 'com.android.application' version '8.7.3' apply false
}

android {
    namespace 'com.rsking.jarvis'
    compileSdk 35
    defaultConfig {
        applicationId 'com.rsking.jarvis'
        minSdk 23
        targetSdk 32
        versionCode 3
        versionName '1.2'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
